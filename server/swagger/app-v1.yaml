components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthLogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    AuthForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    AuthResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string
    AuthAddressRequest:
      type: object
      required:
        - address_line1
        - city
        - state
        - postal_code
        - country
      properties:
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        phone:
          type: string
        is_default:
          type: boolean
    SupportTicketRequest:
      type: object
      required:
        - subject
        - description
        - category_id
      properties:
        subject:
          type: string
        description:
          type: string
        category_id:
          type: integer
    TodoCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date
        priority:
          type: string
          enum: [low, medium, high]
    TodoUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date
        priority:
          type: string
          enum: [low, medium, high]
    TodoCompleteRequest:
      type: object
      required:
        - completed
      properties:
        completed:
          type: boolean
    TodoMultipleCompleteRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
    TodoReminderRequest:
      type: object
      required:
        - reminder_date
      properties:
        reminder_date:
          type: string
          format: date-time
    BBPSCreateOrderRequest:
      type: object
      required:
        - operator_id
      properties:
        bill_fetch_id:
          type: integer
          description: Required for fetch-bill operators; returned by the fetch-bill endpoint.
        operator_id:
          type: integer
        utility_acc_no:
          type: string
          description: Required only for recharge operators.
        sender_name:
          type: string
          description: Required for recharge operators and sent to EKO as the payer name.
        plan_id:
          type: string
          description: Required for recharge operators; returned by the recharge plans endpoint. The server derives the payable amount from this plan.
        circle_id:
          type: string
          description: Telecom circle used when fetching the selected recharge plan.
        cycle_number:
          type: string
    BBPSVerifyPaymentRequest:
      type: object
      required:
        - razorpay_order_id
        - razorpay_payment_id
        - razorpay_signature
      properties:
        razorpay_order_id:
          type: string
        razorpay_payment_id:
          type: string
        razorpay_signature:
          type: string
    BBPSRetryRequest:
      type: object
      required:
        - transaction_id
      properties:
        transaction_id:
          type: integer
    BBPSCheckCustomerRequest:
      type: object
      required:
        - operator_id
      properties:
        operator_id:
          type: integer
    BBPSFetchBillRequest:
      type: object
      required:
        - operator_id
      properties:
        operator_id:
          type: integer
        consumer_number:
          type: string
        confirmation_mobile_no:
          type: string
        sender_name:
          type: string
        cycle_number:
          type: string
        bill_unit:
          type: string
        account_number:
          type: string
    SBCheckoutCartRequest:
      type: object
      required:
        - address_id
      properties:
        address_id:
          type: integer
        expected_total:
          type: number
          format: double
        expected_redeemable:
          type: number
          format: double
        use_rewards:
          type: boolean
    SBBuyNowRequest:
      type: object
      required:
        - product_id
        - address_id
      properties:
        product_id:
          type: integer
        variant_id:
          type: integer
        quantity:
          type: integer
        address_id:
          type: integer
        expected_total:
          type: number
          format: double
        expected_redeemable:
          type: number
          format: double
        use_rewards:
          type: boolean
    CartAddRequest:
      type: object
      required:
        - product_id
        - variant_id
      properties:
        product_id:
          type: integer
        variant_id:
          type: integer
        quantity:
          type: integer
    CartUpdateRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
    OrderCancellationRequest:
      type: object
      required:
        - reason_id
      properties:
        reason_id:
          type: integer
        comment:
          type: string
    ReviewCreateRequest:
      type: object
      required:
        - product_id
        - variant_id
        - order_id
        - rating
      properties:
        product_id:
          type: integer
        variant_id:
          type: integer
        order_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        value_for_money:
          type: integer
          minimum: 1
          maximum: 5
        good_quality:
          type: integer
          minimum: 1
          maximum: 5
        smooth_experience:
          type: integer
          minimum: 1
          maximum: 5
        review_text:
          type: string
security:
  - bearerAuth: []
paths:
  /v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful
        '401':
          $ref: '#/components/schemas/ErrorResponse'
      security: []
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: New access token created
        '401':
          $ref: '#/components/schemas/ErrorResponse'
      security: []
  /v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout from single device and invalidate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutRequest'
      responses:
        '200':
          description: Logged out successfully
      security:
        - bearerAuth: []
  /v1/auth/logout-all:
    post:
      tags:
        - Auth
      summary: Logout from all devices and invalidate all refresh tokens
      responses:
        '200':
          description: Logged out on all devices
      security:
        - bearerAuth: []
  /v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Send forgot password email token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthForgotPasswordRequest'
      responses:
        '200':
          description: Forgot password request accepted
      security: []
  /v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password using reset token
        # note: token is stored as hashed value on server, raw token is sent via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
      security: []
  /v1/auth/change-password:
    put:
      tags:
        - Auth
      summary: Change password for authenticated users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
      security:
        - bearerAuth: []
  /v1/auth/address:
    post:
      tags:
        - Addresses
      summary: Create a new user address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthAddressRequest'
      responses:
        '201':
          description: Address added successfully
      security:
        - bearerAuth: []
    get:
      tags:
        - Addresses
      summary: Get all addresses for authenticated user
      responses:
        '200':
          description: List of user addresses
      security:
        - bearerAuth: []
  /v1/auth/address/{address_id}:
    parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags:
        - Addresses
      summary: Update address by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthAddressRequest'
      responses:
        '200':
          description: Address updated successfully
      security:
        - bearerAuth: []
    delete:
      tags:
        - Addresses
      summary: Delete an address by ID
      responses:
        '200':
          description: Address deleted successfully
      security:
        - bearerAuth: []
  /v1/auth/addresses:
    get:
      tags:
        - Addresses
      summary: Fetch all addresses for authenticated user
      responses:
        '200':
          description: Addresses returned
      security:
        - bearerAuth: []
  /v1/auth/user-info:
    get:
      tags:
        - User
      summary: Get current user profile if token is present
      responses:
        '200':
          description: User profile returned
      security: []
  /v1/auth/activate-account:
    post:
      tags:
        - Auth
      summary: Activate a user account with code and phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                activation_code:
                  type: string
      responses:
        '200':
          description: Account activated
      security: []
  /v1/auth/verify-activation-otp:
    post:
      tags:
        - Auth
      summary: Verify activation OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: OTP verified
      security: []
  /v1/auth/set-password:
    post:
      tags:
        - Auth
      summary: Set password after account activation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                password:
                  type: string
                confirm_password:
                  type: string
      responses:
        '200':
          description: Password set successfully
      security: []
  /v1/auth/update-fcm-token:
    post:
      tags:
        - Auth
      summary: Update device FCM token for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcm_token
              properties:
                fcm_token:
                  type: string
      responses:
        '200':
          description: FCM token updated
      security:
        - bearerAuth: []
  /v1/auth/delete-customer:
    delete:
      tags:
        - Auth
      summary: Delete authenticated customer account
      responses:
        '200':
          description: Customer deleted successfully
      security:
        - bearerAuth: []
  /v1/settings/app-settings:
    get:
      tags:
        - Settings
      summary: Get application settings
      responses:
        '200':
          description: Settings returned
      security: []
  /v1/settings/company-details:
    get:
      tags:
        - Settings
      summary: Get company details
      responses:
        '200':
          description: Company details returned
      security: []
  /v1/support:
    get:
      tags:
        - Support
      summary: Get available support categories
      responses:
        '200':
          description: Support categories returned
      security: []
  /v1/support/ticket:
    post:
      tags:
        - Support
      summary: Create a new support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketRequest'
      responses:
        '201':
          description: Ticket created successfully
      security:
        - bearerAuth: []
  /v1/terms:
    get:
      tags:
        - Terms
      summary: Get terms and conditions
      responses:
        '200':
          description: Terms content returned
      security: []
  /v1/terms/privacy-policy:
    get:
      tags:
        - Terms
      summary: Get privacy policy content
      responses:
        '200':
          description: Privacy policy returned
      security: []
  /v1/terms/current-status:
    get:
      tags:
        - Terms
      summary: Get current terms acceptance status for authenticated user
      responses:
        '200':
          description: Terms status returned
      security:
        - bearerAuth: []
  /v1/terms/accept-terms:
    post:
      tags:
        - Terms
      summary: Accept terms for authenticated user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Terms accepted successfully
      security:
        - bearerAuth: []
  /v1/todo:
    post:
      tags:
        - Todo
      summary: Create a new todo item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreateRequest'
      responses:
        '201':
          description: Todo created successfully
      security:
        - bearerAuth: []
    get:
      tags:
        - Todo
      summary: Get logged in user's todos
      responses:
        '200':
          description: Todo list returned
      security:
        - bearerAuth: []
  /v1/todo/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags:
        - Todo
      summary: Update an existing todo item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdateRequest'
      responses:
        '200':
          description: Todo updated successfully
      security:
        - bearerAuth: []
    delete:
      tags:
        - Todo
      summary: Delete a todo item
      responses:
        '200':
          description: Todo deleted successfully
      security:
        - bearerAuth: []
  /v1/todo/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags:
        - Todo
      summary: Mark a todo item complete or incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCompleteRequest'
      responses:
        '200':
          description: Todo status updated
      security:
        - bearerAuth: []
  /v1/todo/complete/multiple:
    patch:
      tags:
        - Todo
      summary: Mark multiple todos complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoMultipleCompleteRequest'
      responses:
        '200':
          description: Multiple todos updated
      security:
        - bearerAuth: []
  /v1/todo/{id}/reminder:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags:
        - Todo
      summary: Update reminder date for a todo item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoReminderRequest'
      responses:
        '200':
          description: Todo reminder updated
      security:
        - bearerAuth: []
  /v1/notification/my-notification:
    get:
      tags:
        - Notification
      summary: Get notifications for authenticated user
      responses:
        '200':
          description: Notification list returned
      security:
        - bearerAuth: []
  /v1/notification/notification-badge:
    get:
      tags:
        - Notification
      summary: Get unread notification badge count
      responses:
        '200':
          description: Badge count returned
      security:
        - bearerAuth: []
  /v1/notification/read/{notification_id}:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags:
        - Notification
      summary: Mark a notification as read
      responses:
        '200':
          description: Notification marked as read
      security:
        - bearerAuth: []
  /v1/wallet/balance:
    get:
      tags:
        - Wallet
      summary: Get user wallet balance
      responses:
        '200':
          description: Wallet balance returned
      security:
        - bearerAuth: []
  /v1/wallet/transactions:
    get:
      tags:
        - Wallet
      summary: Get wallet transaction history
      responses:
        '200':
          description: Wallet transactions returned
      security:
        - bearerAuth: []
  /v1/checkout/get-cart:
    get:
      tags:
        - Checkout
      summary: Get checkout view for cart items
      parameters:
        - name: use_rewards
          in: query
          schema:
            type: string
            enum: [true, false]
      responses:
        '200':
          description: Checkout cart returned
      security:
        - bearerAuth: []
  /v1/checkout/get-buy-now:
    get:
      tags:
        - Checkout
      summary: Get checkout view for a buy now item
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
        - name: variant_id
          in: query
          required: true
          schema:
            type: integer
        - name: qty
          in: query
          schema:
            type: integer
        - name: use_rewards
          in: query
          schema:
            type: string
            enum: [true, false]
      responses:
        '200':
          description: Buy now checkout returned
      security:
        - bearerAuth: []
  /v1/checkout/cart:
    post:
      tags:
        - Checkout
      summary: Place order for items in cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SBCheckoutCartRequest'
      responses:
        '200':
          description: Cart checkout created
      security:
        - bearerAuth: []
  /v1/checkout/buy-now:
    post:
      tags:
        - Checkout
      summary: Place order for buy-now item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SBBuyNowRequest'
      responses:
        '200':
          description: Buy now order created
      security:
        - bearerAuth: []
  /v1/checkout/order-receipt/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Checkout
      summary: Get order receipt details
      responses:
        '200':
          description: Receipt returned
      security:
        - bearerAuth: []
  /v1/cart/cart-items:
    get:
      tags:
        - Cart
      summary: Get cart items for authenticated user
      responses:
        '200':
          description: Cart items returned
      security:
        - bearerAuth: []
    delete:
      tags:
        - Cart
      summary: Remove all cart items
      responses:
        '200':
          description: Cart cleared
      security:
        - bearerAuth: []
  /v1/cart/cart-summary:
    get:
      tags:
        - Cart
      summary: Get cart pricing summary
      parameters:
        - name: use_rewards
          in: query
          schema:
            type: string
            enum: [true, false]
      responses:
        '200':
          description: Cart summary returned
      security:
        - bearerAuth: []
  /v1/cart/cart-item:
    post:
      tags:
        - Cart
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddRequest'
      responses:
        '200':
          description: Item added to cart
      security:
        - bearerAuth: []
  /v1/cart/cart-items/check-stock/{variantId}:
    parameters:
      - name: variantId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Cart
      summary: Check stock for a variant
      responses:
        '200':
          description: Stock status returned
      security: []
  /v1/cart/cart-items/{cart_item_id}:
    parameters:
      - name: cart_item_id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartUpdateRequest'
      responses:
        '200':
          description: Cart item updated
      security:
        - bearerAuth: []
    delete:
      tags:
        - Cart
      summary: Delete cart item
      responses:
        '200':
          description: Cart item deleted
      security:
        - bearerAuth: []
  /v1/orders/orders-history:
    get:
      tags:
        - Orders
      summary: Get order history for authenticated user
      responses:
        '200':
          description: Order history returned
      security:
        - bearerAuth: []
  /v1/orders/order-details/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Orders
      summary: Get order details
      responses:
        '200':
          description: Order details returned
      security:
        - bearerAuth: []
  /v1/orders/buy-again:
    get:
      tags:
        - Orders
      summary: Get buy again products
      responses:
        '200':
          description: Buy again product list returned
      security:
        - bearerAuth: []
  /v1/orders/cancellation-reasons:
    get:
      tags:
        - Orders
      summary: Get cancellation reasons
      responses:
        '200':
          description: Cancellation reasons returned
      security: []
  /v1/orders/cancel/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Orders
      summary: Request order cancellation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancellationRequest'
      responses:
        '200':
          description: Cancellation request submitted
      security:
        - bearerAuth: []
  /v1/orders/cancellation-details/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Orders
      summary: Get order cancellation details
      responses:
        '200':
          description: Cancellation details returned
      security: []
  /v1/orders/invoice/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags:
        - Orders
      summary: Get order invoice
      responses:
        '200':
          description: Invoice data returned
      security:
        - bearerAuth: []
  /v1/products/all-products:
    get:
      tags:
        - Products
      summary: List all products
      responses:
        '200':
          description: Product list returned
      security: []
  /v1/products/by-category/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
